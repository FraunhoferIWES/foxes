engine:
  engine_type: process
  n_procs: null
  chunk_size_states: 300
  chunk_size_points: 1000

states:
  states_type: Timeseries
  data_source: timeseries_8000.csv.gz
  output_vars: [WS, WD, TI, RHO]
  var2col:
    WS: ws
    WD: wd
    TI: ti
  fixed_vars:
    RHO: 1.225

model_book:
  turbine_types:
    - name: my_turbine
      ttype_type: PCtFile
      data_source: NREL-5MW-D126-H90.csv

wind_farm:
  layouts:
    - function: add_from_file
      file_path: test_farm_67.csv
      turbine_models: [my_turbine]

algorithm:
  algo_type: Downwind
  wake_models: [Bastankhah2014_linear_k004]

calc_farm:
  outputs: farm_results_all   # preserve ambient direction for the wind rose

outputs:
  - output_type: FlowPlots2D
    plane: xy
    reduction: mean
    var: WS
    grid_pars:
      resolution: 150
    plot_pars:
      figsize: [6, 6]
    show: True
  - output_type: plt            # YAML-only Matplotlib calls, not an output model
    functions:
      - function: figure
        figsize: [10, 5]
        result_labels: $fig
  - object: $fig
    functions:
      - function: add_subplot
        args: [1, 2, 1]
        result_labels: $ax1
      - function: add_subplot
        args: [1, 2, 2]
        polar: True
        result_labels: $ax2
  - output_type: FarmLayoutOutput
    with_engine: False
    parameters:
      fig: $fig
      ax: $ax1
  - output_type: RosePlotOutput
    with_engine: False
    turbine: 0
    ws_var: AMB_REWS
    ws_bins: [0, 3, 6, 9, 12, 15, 18, 21]
    add_inf: True
    wd_sectors: 16
    plot_pars:
      title: Wind rose
      ax: $ax2
  - object: $fig
    functions:
      - function: savefig
        fname: result.png
  - output_type: plt
    functions:
      - function: show
      - function: close
        args: [$fig]
