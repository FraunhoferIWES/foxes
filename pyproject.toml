# pyproject.toml file specified at the root of the directory

[project]
name = "foxes"
version = "1.9.1"
authors = [
  {name = "Jonas Schulte"},
]
maintainers = [
  {name = "Jonas Schulte"}
]
description = "Farm Optimization and eXtended yield Evaluation Software"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Wind farm", "Wake modelling", "Wind farm optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",
    "xarray>=2023",
    "netcdf4>=1.6",
    "h5netcdf>=1.8.1",
    "h5py>=3.11.0",
    "pyyaml>=6.0",
    "tqdm>=4.31.1",
    "utm>=0.5",
]

[project.optional-dependencies]
opt = [
    "foxes-opt>=0.7"
]
icon_dream = [
    "cdo>=1.0.4",
    "requests>=2.31",
]
era5 = [
    "metpy>=1.6",
]
shp = [
    "geopandas>=0.14.4",
]
mpi = [
    "mpi4py>=4.0",
]
ray = [
    "ray>=2.58.0",
]
multiprocess = [
    "multiprocess>=0.70.17",
]
dask = [
    "dask>=2022.0",
    "distributed>=2022.0",
    "dask-jobqueue>=0.8",
    "setuptools>=84.0.0",
]
doc = [
    "setuptools>=84.0.0",
    "sphinx>=5.0",
    "sphinx-autoapi>=3.0",
    "numpydoc>=1.0",
    "sphinx-immaterial>=0.10",
    "myst-nb>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "ipykernel>=6.0.2",
    "ipywidgets>=8.0",
    "lxml_html_clean>=0.4",
    "dask>=2022.0",
    "distributed>=2022.0",
    "jupyterlab>=4.6.3",
    "mistune>=3.3.4",
    "nbconvert>=7.17.1",
    "pillow>=12.3.0",
    "tornado>=6.5.8",
]
test = [
    "pytest>=7.0",
    "nbmake>=1.0",
    "pre-commit>=3.0",
    "mypy>=1.11.0,!=2.3.1",
    "multiprocess>=0.70.17",
    "jupyterlab>=4.6.3",
    "mistune>=3.3.4",
    "nbconvert>=7.17.1",
    "pillow>=12.3.0",
    "tornado>=6.5.8",
]
dev = [
    "pre-commit>=3.0",
    "mypy>=1.11.0,!=2.3.1",
    "objsize>=0.5",
    "jupyter>=1.0",
    "jupyterlab>=4.6.3",
    "mistune>=3.3.4",
    "nbconvert>=7.17.1",
    "pillow>=12.3.0",
    "tornado>=6.5.8",
]

[project.urls]
Homepage = "https://github.com/FraunhoferIWES/foxes"
Documentation = "https://fraunhoferiwes.github.io/foxes"
Repository = "https://github.com/FraunhoferIWES/foxes.git"
"Bug Tracker" = "https://github.com/FraunhoferIWES/foxes/issues"
Changelog = "https://github.com/FraunhoferIWES/foxes/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["foxes*"]

[tool.mypy]
python_version = "3.10"
files = ["foxes"]
exclude = [
    "examples/",
    "docs/",
    "notebooks/",
    "tests/",
]
no_site_packages = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = false

[project.scripts]
foxes_yaml = "foxes.input.yaml.yaml:main"
foxes_windio = "foxes.input.yaml.windio.windio:main"
foxes_create_mean_dataset = "foxes.input.states.create.dataset_mean:main"
wrf2foxes = "foxes.input.states.create.wrf2foxes:main"
era52foxes = "foxes.input.states.create.era52foxes:main"
iconDream2foxes = "foxes.input.states.create.icon_dream:main"
eww2foxes = "foxes.input.farm_layout.from_eww:main"
foxes_create_gaussian_lookup = "foxes.utils.create_gaussian_lookup:main"
